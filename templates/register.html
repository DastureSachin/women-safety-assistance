{% extends "base.html" %}
{% block title %}Create Account · Women Safety{% endblock %}
{% block content %}
<section class="auth-card">
    <h1>Create Your Account 🩷</h1>
    <p class="subtitle">Join us and keep your safety tools in one place.</p>
    <form method="post" action="{{ url_for('register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" maxlength="100" required value="{{ name }}">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required value="{{ email }}">
        <label for="password">Password <span class="field-hint">(at least 8 characters)</span></label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required>
        <button class="button" type="submit">Create account</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
