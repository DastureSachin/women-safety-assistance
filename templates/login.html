{% extends "base.html" %}
{% block title %}Log in · Women Safety{% endblock %}
{% block content %}
<section class="auth-card">
    <h1>Welcome Back 💜</h1>
    <p class="subtitle">Log in to access your safety dashboard.</p>
    <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required value="{{ email }}">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="button" type="submit">Log in</button>
    </form>
    <p>Don't have an account? <a href="{{ url_for('register') }}">Create account</a></p>
</section>
{% endblock %}
