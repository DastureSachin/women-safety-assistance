services:
  - type: web
    name: women-safety-assistance
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    disk:
      name: women-safety-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE
        value: /var/data/women_safety.db
      - key: SESSION_COOKIE_SECURE
        value: "true"
